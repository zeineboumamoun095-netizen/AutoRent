# =============================================
#  PROFIL DEV — Base de données H2 (mémoire)
#  Lancer avec: -Dspring.profiles.active=dev
# =============================================

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:autorentdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (accessible sur /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=false

# Logs détaillés en dev
logging.level.com.autorent=DEBUG
logging.level.org.springframework.security=DEBUG