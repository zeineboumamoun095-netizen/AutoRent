<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Agenda - Agent AutoRent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<nav th:replace="~{common/layout :: navbar}"></nav>

<div class="container-fluid py-4">
    <div class="row">
        <div class="col-md-2">
            <div class="list-group">
                <a th:href="@{/agent/dashboard}" class="list-group-item list-group-item-action">
                    <i class="fas fa-tachometer-alt me-2"></i>Dashboard
                </a>
                <a th:href="@{/agent/reservations}" class="list-group-item list-group-item-action">
                    <i class="fas fa-calendar me-2"></i>Réservations
                </a>
                <a th:href="@{/agent/agenda}" class="list-group-item list-group-item-action active">
                    <i class="fas fa-calendar-alt me-2"></i>Agenda
                </a>
                <a th:href="@{/agent/vehicules}" class="list-group-item list-group-item-action">
                    <i class="fas fa-car me-2"></i>Véhicules
                </a>
            </div>
        </div>
        <div class="col-md-10">
            <h3 class="fw-bold mb-4"><i class="fas fa-calendar-alt me-2 text-warning"></i>Agenda des Réservations</h3>

            <div class="row g-3" th:if="${!reservations.isEmpty()}">
                <div class="col-md-4" th:each="r : ${reservations}">
                    <div class="card shadow-sm border-start border-4 border-warning">
                        <div class="card-body">
                            <div class="d-flex justify-content-between mb-2">
                                <h6 class="fw-bold mb-0" th:text="${r.vehicule.marque + ' ' + r.vehicule.modele}"></h6>
                                <span th:class="${'badge ' + (r.statut.name() == 'EN_ATTENTE' ? 'bg-warning text-dark' : r.statut.name() == 'CONFIRMEE' ? 'bg-success' : 'bg-primary')}"
                                      th:text="${r.statut}"></span>
                            </div>
                            <p class="text-muted small mb-1">
                                <i class="fas fa-user me-1"></i>
                                <span th:text="${r.client.fullName}"></span>
                            </p>
                            <p class="text-muted small mb-1">
                                <i class="fas fa-calendar me-1"></i>
                                <span th:text="${#temporals.format(r.dateDebut, 'dd/MM/yyyy')}"></span>
                                →
                                <span th:text="${#temporals.format(r.dateFin, 'dd/MM/yyyy')}"></span>
                            </p>
                            <p class="text-muted small mb-2">
                                <i class="fas fa-clock me-1"></i>
                                <span th:text="${r.nombreJours + ' jour(s)'}"></span>
                            </p>
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="fw-bold text-success" th:text="${r.coutTotal + ' €'}"></span>
                                <a th:href="@{/agent/reservation/{id}(id=${r.id})}"
                                   class="btn btn-outline-dark btn-sm">
                                    <i class="fas fa-eye me-1"></i>Voir
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="text-center py-5" th:if="${reservations.isEmpty()}">
                <i class="fas fa-calendar-times fa-4x text-muted mb-3"></i>
                <h4 class="text-muted">Aucune réservation à venir</h4>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{common/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
