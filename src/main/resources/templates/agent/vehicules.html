<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Véhicules - Agent AutoRent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<nav th:replace="~{common/layout :: navbar}"></nav>

<div class="container-fluid p-0">
    <div class="d-flex" style="min-height: calc(100vh - 73px)">

        <!-- Sidebar -->
        <div class="sidebar" style="width:240px; flex-shrink:0;">
            <div class="sidebar-header">
                <span class="role-badge">Agent</span>
                <p class="sidebar-title">Espace Agent</p>
            </div>
            <nav class="sidebar-nav">
                <span class="nav-section">Navigation</span>
                <a th:href="@{/agent/dashboard}" class="sidebar-link">
                    <i class="fas fa-tachometer-alt"></i> Dashboard
                </a>
                <a th:href="@{/agent/reservations}" class="sidebar-link">
                    <i class="fas fa-calendar-check"></i> Réservations
                </a>
                <a th:href="@{/agent/agenda}" class="sidebar-link">
                    <i class="fas fa-calendar-alt"></i> Agenda
                </a>
                <a th:href="@{/agent/vehicules}" class="sidebar-link active">
                    <i class="fas fa-car"></i> Véhicules
                </a>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="flex-grow-1 p-0">
            <div class="page-header">
                <div>
                    <h3>Flotte de Véhicules</h3>
                    <div class="page-breadcrumb">
                        <ol class="breadcrumb breadcrumb-ar mb-0">
                            <li class="breadcrumb-item"><a th:href="@{/agent/dashboard}">Dashboard</a></li>
                            <li class="breadcrumb-item active">Véhicules</li>
                        </ol>
                    </div>
                </div>
            </div>

            <div class="px-4 pb-4">

                <!-- Flash messages -->
                <div th:if="${success}" class="alert-ar-success mb-4">
                    <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
                </div>
                <div th:if="${error}" class="alert-ar-danger mb-4">
                    <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
                </div>

                <!-- Table -->
                <div class="ar-table-wrapper">
                    <div class="ar-table-header">
                        <h6 class="ar-table-title"><i class="fas fa-car me-2" style="color:var(--accent)"></i>Liste des véhicules</h6>
                        <span class="badge-ar badge-agent" th:text="${vehicules.size() + ' véhicule(s)'}"></span>
                    </div>
                    <div class="table-responsive">
                        <table class="ar-table">
                            <thead>
                            <tr>
                                <th>#</th>
                                <th>Véhicule</th>
                                <th>Immat.</th>
                                <th>Catégorie</th>
                                <th>Carburant</th>
                                <th>Transmission</th>
                                <th>Places</th>
                                <th>Prix/Jour</th>
                                <th>Statut</th>
                                <th>Actions</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="v : ${vehicules}">
                                <td class="td-muted" th:text="${v.id}"></td>
                                <td>
                                    <div class="d-flex align-items-center gap-3">
                                        <div style="width:40px;height:40px;background:linear-gradient(135deg,var(--primary),var(--primary-light));border-radius:8px;display:flex;align-items:center;justify-content:center;">
                                            <i class="fas fa-car text-white" style="font-size:0.9rem;"></i>
                                        </div>
                                        <div>
                                            <div class="td-bold" th:text="${v.marque + ' ' + v.modele}"></div>
                                            <div class="td-muted" th:text="${v.annee + ' · ' + v.couleur}"></div>
                                        </div>
                                    </div>
                                </td>
                                <td>
                    <span style="font-family:monospace;font-size:0.85rem;background:var(--light-bg);padding:3px 8px;border-radius:6px;"
                          th:text="${v.immatriculation}"></span>
                                </td>
                                <td>
                                    <span class="badge-ar badge-agent" th:text="${v.categorie.nom}"></span>
                                </td>
                                <td th:text="${v.typeCarburant}"></td>
                                <td th:text="${v.transmission}"></td>
                                <td th:text="${v.nombrePlaces}"></td>
                                <td>
                                    <span style="font-weight:700;color:var(--primary);" th:text="${v.prixParJour + ' MRU'}"></span>
                                </td>
                                <td>
                    <span class="badge-ar badge-active" th:if="${v.disponible}">
                      <i class="fas fa-circle me-1" style="font-size:0.5rem;"></i>Disponible
                    </span>
                                    <span class="badge-ar badge-inactive" th:unless="${v.disponible}">
                      <i class="fas fa-circle me-1" style="font-size:0.5rem;"></i>Indisponible
                    </span>
                                </td>
                                <td>
                                    <a th:href="@{/agent/vehicule/{id}(id=${v.id})}" class="action-btn info" title="Fiche véhicule">
                                        <i class="fas fa-eye"></i>
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${vehicules.isEmpty()}">
                                <td colspan="10">
                                    <div class="empty-state py-4">
                                        <i class="fas fa-car"></i>
                                        <p>Aucun véhicule enregistré</p>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<footer th:replace="~{common/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
