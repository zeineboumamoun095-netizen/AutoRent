<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Agent - AutoRent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<nav th:replace="~{common/layout :: navbar}"></nav>

<div class="container-fluid p-0">
    <div class="d-flex" style="min-height: calc(100vh - 73px)">

        <div class="sidebar" style="width:240px;flex-shrink:0;">
            <div class="sidebar-header">
                <span class="role-badge">Agent</span>
                <p class="sidebar-title">Espace Agent</p>
            </div>
            <nav class="sidebar-nav">
                <span class="nav-section">Navigation</span>
                <a th:href="@{/agent/dashboard}" class="sidebar-link active"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
                <a th:href="@{/agent/reservations}" class="sidebar-link"><i class="fas fa-calendar-check"></i> Réservations</a>
                <a th:href="@{/agent/agenda}" class="sidebar-link"><i class="fas fa-calendar-alt"></i> Agenda</a>
                <a th:href="@{/agent/vehicules}" class="sidebar-link"><i class="fas fa-car"></i> Véhicules</a>
            </nav>
        </div>

        <div class="flex-grow-1 p-0">
            <div class="page-header">
                <div>
                    <h3>Tableau de Bord Agent</h3>
                    <p class="page-breadcrumb">Gestion des réservations et de la flotte</p>
                </div>
            </div>

            <div class="px-4 pb-4">

                <!-- Stats -->
                <div class="row g-3 mb-4">
                    <div class="col-md-3">
                        <div class="stat-card">
                            <div class="stat-icon gold"><i class="fas fa-car"></i></div>
                            <div>
                                <div class="stat-value" th:text="${totalVehicules}">0</div>
                                <div class="stat-label">Total Véhicules</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-card">
                            <div class="stat-icon green"><i class="fas fa-check-circle"></i></div>
                            <div>
                                <div class="stat-value" th:text="${disponibles}">0</div>
                                <div class="stat-label">Disponibles</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-card">
                            <div class="stat-icon navy"><i class="fas fa-list"></i></div>
                            <div>
                                <div class="stat-value" th:text="${reservations.size()}">0</div>
                                <div class="stat-label">Réservations</div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-card">
                            <div class="stat-icon blue"><i class="fas fa-calendar-alt"></i></div>
                            <div>
                                <div class="stat-value" th:text="${upcoming.size()}">0</div>
                                <div class="stat-label">À venir</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Reservations Table -->
                <div class="ar-table-wrapper">
                    <div class="ar-table-header">
                        <h6 class="ar-table-title">
                            <i class="fas fa-clock me-2" style="color:var(--accent)"></i>Réservations Récentes
                        </h6>
                        <a th:href="@{/agent/reservations}" class="btn-primary-ar"
                           style="display:flex;align-items:center;gap:6px;text-decoration:none;font-size:0.82rem;padding:8px 16px;">
                            Tout voir
                        </a>
                    </div>
                    <div class="table-responsive">
                        <table class="ar-table">
                            <thead>
                            <tr>
                                <th>#</th><th>Client</th><th>Véhicule</th>
                                <th>Début</th><th>Fin</th><th>Coût</th><th>Statut</th><th>Actions</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="r : ${reservations}" th:if="${rStat.index < 10}">
                                <td class="td-muted" th:text="${r.id}"></td>
                                <td>
                                    <div class="td-bold" th:text="${r.client.fullName}"></div>
                                </td>
                                <td th:text="${r.vehicule.marque + ' ' + r.vehicule.modele}"></td>
                                <td style="font-size:0.82rem;" th:text="${#temporals.format(r.dateDebut, 'dd/MM/yyyy')}"></td>
                                <td style="font-size:0.82rem;" th:text="${#temporals.format(r.dateFin, 'dd/MM/yyyy')}"></td>
                                <td><span style="font-weight:700;" th:text="${r.coutTotal + ' €'}"></span></td>
                                <td>
                                    <span class="badge-ar badge-waiting"   th:if="${r.statut.name() == 'EN_ATTENTE'}"  th:text="${r.statut}"></span>
                                    <span class="badge-ar badge-confirmed" th:if="${r.statut.name() == 'CONFIRMEE'}"   th:text="${r.statut}"></span>
                                    <span class="badge-ar badge-ongoing"   th:if="${r.statut.name() == 'EN_COURS'}"    th:text="${r.statut}"></span>
                                    <span class="badge-ar badge-done"      th:if="${r.statut.name() == 'TERMINEE'}"    th:text="${r.statut}"></span>
                                    <span class="badge-ar badge-cancelled" th:if="${r.statut.name() == 'ANNULEE'}"     th:text="${r.statut}"></span>
                                </td>
                                <td>
                                    <div class="d-flex gap-1">
                                        <a th:href="@{/agent/reservation/{id}(id=${r.id})}" class="action-btn info" title="Détails">
                                            <i class="fas fa-eye"></i>
                                        </a>
                                        <form th:action="@{/agent/reservation/{id}/confirmer(id=${r.id})}"
                                              method="post" th:if="${r.statut.name() == 'EN_ATTENTE'}">
                                            <button type="submit" class="action-btn success" title="Confirmer">
                                                <i class="fas fa-check"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${reservations.isEmpty()}">
                                <td colspan="8">
                                    <div class="empty-state py-4">
                                        <i class="fas fa-calendar-times"></i>
                                        <p>Aucune réservation</p>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{common/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
