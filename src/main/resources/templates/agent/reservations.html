<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Réservations - Agent AutoRent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<nav th:replace="~{common/layout :: navbar}"></nav>

<div class="container-fluid p-0">
    <div class="d-flex" style="min-height: calc(100vh - 73px)">
        <div class="sidebar" style="width:240px;flex-shrink:0;">
            <div class="sidebar-header">
                <span class="role-badge">Agent</span>
                <p class="sidebar-title">Espace Agent</p>
            </div>
            <nav class="sidebar-nav">
                <span class="nav-section">Navigation</span>
                <a th:href="@{/agent/dashboard}" class="sidebar-link"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
                <a th:href="@{/agent/reservations}" class="sidebar-link active"><i class="fas fa-calendar-check"></i> Réservations</a>
                <a th:href="@{/agent/agenda}" class="sidebar-link"><i class="fas fa-calendar-alt"></i> Agenda</a>
                <a th:href="@{/agent/vehicules}" class="sidebar-link"><i class="fas fa-car"></i> Véhicules</a>
            </nav>
        </div>

        <div class="flex-grow-1 p-0">
            <div class="page-header">
                <div>
                    <h3>Gestion des Réservations</h3>
                    <ol class="breadcrumb breadcrumb-ar mb-0">
                        <li class="breadcrumb-item"><a th:href="@{/agent/dashboard}">Dashboard</a></li>
                        <li class="breadcrumb-item active">Réservations</li>
                    </ol>
                </div>
            </div>

            <div class="px-4 pb-4">
                <div th:if="${success}" class="alert-ar-success mb-4">
                    <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
                </div>
                <div th:if="${error}" class="alert-ar-danger mb-4">
                    <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
                </div>

                <div class="ar-table-wrapper">
                    <div class="ar-table-header">
                        <h6 class="ar-table-title"><i class="fas fa-calendar-check me-2" style="color:var(--accent)"></i>Toutes les Réservations</h6>
                        <span class="badge-ar badge-agent" th:text="${reservations.size() + ' réservation(s)'}"></span>
                    </div>
                    <div class="table-responsive">
                        <table class="ar-table">
                            <thead>
                            <tr>
                                <th>#</th><th>Client</th><th>Véhicule</th>
                                <th>Début</th><th>Fin</th><th>Durée</th><th>Coût</th><th>Statut</th><th>Actions</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="r : ${reservations}">
                                <td class="td-muted" th:text="${r.id}"></td>
                                <td>
                                    <div class="td-bold" th:text="${r.client.fullName}"></div>
                                    <div class="td-muted" th:text="${r.client.email}"></div>
                                </td>
                                <td th:text="${r.vehicule.marque + ' ' + r.vehicule.modele}"></td>
                                <td style="font-size:0.82rem;" th:text="${#temporals.format(r.dateDebut, 'dd/MM/yyyy')}"></td>
                                <td style="font-size:0.82rem;" th:text="${#temporals.format(r.dateFin, 'dd/MM/yyyy')}"></td>
                                <td th:text="${r.nombreJours + 'j'}"></td>
                                <td><span style="font-weight:700;color:var(--primary);" th:text="${r.coutTotal + ' €'}"></span></td>
                                <td>
                                    <span class="badge-ar badge-waiting"   th:if="${r.statut.name() == 'EN_ATTENTE'}"  th:text="${r.statut}"></span>
                                    <span class="badge-ar badge-confirmed" th:if="${r.statut.name() == 'CONFIRMEE'}"   th:text="${r.statut}"></span>
                                    <span class="badge-ar badge-ongoing"   th:if="${r.statut.name() == 'EN_COURS'}"    th:text="${r.statut}"></span>
                                    <span class="badge-ar badge-done"      th:if="${r.statut.name() == 'TERMINEE'}"    th:text="${r.statut}"></span>
                                    <span class="badge-ar badge-cancelled" th:if="${r.statut.name() == 'ANNULEE'}"     th:text="${r.statut}"></span>
                                </td>
                                <td>
                                    <div class="d-flex gap-1">
                                        <a th:href="@{/agent/reservation/{id}(id=${r.id})}" class="action-btn info" title="Détails">
                                            <i class="fas fa-eye"></i>
                                        </a>
                                        <form th:action="@{/agent/reservation/{id}/confirmer(id=${r.id})}"
                                              method="post" th:if="${r.statut.name() == 'EN_ATTENTE'}">
                                            <button type="submit" class="action-btn success" title="Confirmer">
                                                <i class="fas fa-check"></i>
                                            </button>
                                        </form>
                                        <form th:action="@{/agent/reservation/{id}/statut(id=${r.id})}"
                                              method="post" th:if="${r.statut.name() == 'CONFIRMEE'}">
                                            <input type="hidden" name="statut" value="EN_COURS">
                                            <button type="submit" class="action-btn info" title="Démarrer">
                                                <i class="fas fa-play"></i>
                                            </button>
                                        </form>
                                        <form th:action="@{/agent/reservation/{id}/statut(id=${r.id})}"
                                              method="post" th:if="${r.statut.name() == 'EN_COURS'}">
                                            <input type="hidden" name="statut" value="TERMINEE">
                                            <button type="submit" class="action-btn" title="Terminer">
                                                <i class="fas fa-stop"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${reservations.isEmpty()}">
                                <td colspan="9">
                                    <div class="empty-state py-4">
                                        <i class="fas fa-calendar-times"></i>
                                        <p>Aucune réservation</p>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{common/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
