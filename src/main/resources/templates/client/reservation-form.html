<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Réservation - AutoRent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<nav th:replace="~{common/layout :: navbar}"></nav>

<div class="container py-5">
    <h2 class="fw-bold mb-4">
        <i class="fas fa-calendar-check me-2 text-warning"></i>Formulaire de Réservation
    </h2>

    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <div class="row g-4">
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-header bg-warning text-dark fw-bold">
                    <i class="fas fa-car me-2"></i>Véhicule sélectionné
                </div>
                <div class="card-body">
                    <div class="bg-secondary rounded d-flex align-items-center justify-content-center mb-3" style="height:150px">
                        <i class="fas fa-car fa-4x text-white"></i>
                    </div>
                    <h5 class="fw-bold" th:text="${vehicule.marque + ' ' + vehicule.modele}"></h5>
                    <p class="text-muted small" th:text="${vehicule.categorie.nom}"></p>
                    <hr>
                    <div class="small">
                        <div class="d-flex justify-content-between mb-1">
                            <span class="text-muted">Année:</span>
                            <span th:text="${vehicule.annee}"></span>
                        </div>
                        <div class="d-flex justify-content-between mb-1">
                            <span class="text-muted">Places:</span>
                            <span th:text="${vehicule.nombrePlaces}"></span>
                        </div>
                        <div class="d-flex justify-content-between mb-1">
                            <span class="text-muted">Carburant:</span>
                            <span th:text="${vehicule.typeCarburant}"></span>
                        </div>
                        <div class="d-flex justify-content-between mb-1">
                            <span class="text-muted">Transmission:</span>
                            <span th:text="${vehicule.transmission}"></span>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between">
                            <span class="text-muted">Prix/jour:</span>
                            <span class="fw-bold text-success fs-5" th:text="${vehicule.prixParJour + ' MRU'}"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white fw-bold">
                    <i class="fas fa-edit me-2"></i>Détails de la réservation
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/client/reserver}" method="post" th:object="${reservationDto}">

                        <input type="hidden" name="vehiculeId" th:value="${vehicule.id}">

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Date de début *</label>
                                <input type="date" class="form-control" th:field="*{dateDebut}" id="dateDebut" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Date de fin *</label>
                                <input type="date" class="form-control" th:field="*{dateFin}" id="dateFin" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-bold">Remarques</label>
                                <textarea class="form-control" th:field="*{remarques}" rows="3"></textarea>
                            </div>
                        </div>

                        <div class="card border-success mt-4" id="calculCard" style="display:none">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center">
                                    <span class="fw-bold">Coût estimé:</span>
                                    <span class="fw-bold text-success fs-4" id="coutEstime">0 MRU</span>
                                </div>
                                <small class="text-muted" id="dureeText"></small>
                            </div>
                        </div>

                        <div class="d-flex gap-3 mt-4">
                            <a th:href="@{/vehicules}" class="btn btn-outline-secondary flex-fill">
                                <i class="fas fa-arrow-left me-2"></i>Retour
                            </a>
                            <button type="submit" class="btn btn-warning flex-fill fw-bold">
                                <i class="fas fa-check me-2"></i>Confirmer la réservation
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div>
    <span id="prix-data" th:data-prix="${vehicule.prixParJour}"></span>
</div>

<footer th:replace="~{common/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    var prixParJour = parseFloat(
        document.querySelector('[data-prix]') ?
            document.querySelector('[data-prix]').getAttribute('data-prix') : 0
    );

    var dateDebut  = document.getElementById('dateDebut');
    var dateFin    = document.getElementById('dateFin');
    var calculCard = document.getElementById('calculCard');
    var coutEstime = document.getElementById('coutEstime');
    var dureeText  = document.getElementById('dureeText');

    var today = new Date().toISOString().split('T')[0];
    dateDebut.min = today;
    dateFin.min   = today;

    function calculerCout() {
        if (dateDebut.value && dateFin.value) {
            var d1    = new Date(dateDebut.value);
            var d2    = new Date(dateFin.value);
            var jours = Math.ceil((d2 - d1) / (1000 * 60 * 60 * 24));
            if (jours > 0) {
                coutEstime.textContent = (jours * prixParJour).toFixed(2) + ' MRU';
                dureeText.textContent  = jours + ' jour(s) × ' + prixParJour + ' MRU/jour';
                calculCard.style.display = 'block';
            }
        }
    }

    dateDebut.addEventListener('change', function() {
        dateFin.min = dateDebut.value;
        calculerCout();
    });
    dateFin.addEventListener('change', calculerCout);
</script>
</body>
</html>
