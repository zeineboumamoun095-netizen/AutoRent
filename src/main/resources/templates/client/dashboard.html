<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mon Espace - AutoRent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<nav th:replace="~{common/layout :: navbar}"></nav>

<div class="container py-5">
    <!-- Alertes flash -->
    <div class="alert alert-success alert-dismissible" th:if="${success}">
        <i class="fas fa-check-circle me-2"></i><span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible" th:if="${error}">
        <i class="fas fa-exclamation-circle me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1">Bonjour, <span th:text="${user.prenom}"></span> !</h2>
            <p class="text-muted mb-0">Gérez vos réservations</p>
        </div>
        <a th:href="@{/vehicules}" class="btn btn-warning fw-bold">
            <i class="fas fa-plus me-2"></i>Nouvelle réservation
        </a>
    </div>

    <!-- Mes Réservations -->
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0"><i class="fas fa-calendar me-2"></i>Mes Réservations</h5>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>#</th>
                        <th>Véhicule</th>
                        <th>Date début</th>
                        <th>Date fin</th>
                        <th>Durée</th>
                        <th>Coût total</th>
                        <th>Statut</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="r : ${reservations}">
                        <td th:text="${r.id}"></td>
                        <td>
                            <strong th:text="${r.vehicule.marque + ' ' + r.vehicule.modele}"></strong><br>
                            <small class="text-muted" th:text="${r.vehicule.immatriculation}"></small>
                        </td>
                        <td th:text="${#temporals.format(r.dateDebut, 'dd/MM/yyyy')}"></td>
                        <td th:text="${#temporals.format(r.dateFin, 'dd/MM/yyyy')}"></td>
                        <td th:text="${r.nombreJours + ' jour(s)'}"></td>
                        <td class="fw-bold text-success" th:text="${r.coutTotal + ' €'}"></td>
                        <td>
                                <span th:class="${'badge ' +
                                    (r.statut.name() == 'EN_ATTENTE' ? 'bg-warning text-dark' :
                                    r.statut.name() == 'CONFIRMEE' ? 'bg-success' :
                                    r.statut.name() == 'EN_COURS' ? 'bg-primary' :
                                    r.statut.name() == 'TERMINEE' ? 'bg-secondary' : 'bg-danger')}"
                                      th:text="${r.statut}">
                                </span>
                        </td>
                        <td>
                            <form th:action="@{/client/reservation/{id}/annuler(id=${r.id})}"
                                  method="post"
                                  th:if="${r.statut.name() == 'EN_ATTENTE'}"
                                  onsubmit="return confirm('Confirmer l\'annulation ?')">
                                <button type="submit" class="btn btn-outline-danger btn-sm">
                                    <i class="fas fa-times"></i> Annuler
                                </button>
                            </form>
                            <span class="text-muted small" th:unless="${r.statut.name() == 'EN_ATTENTE'}">—</span>
                        </td>
                    </tr>
                    <tr th:if="${reservations.isEmpty()}">
                        <td colspan="8" class="text-center py-4 text-muted">
                            <i class="fas fa-calendar-times fa-2x mb-2"></i><br>
                            Aucune réservation. <a th:href="@{/vehicules}">Réserver un véhicule</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{common/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
