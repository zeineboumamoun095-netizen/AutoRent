<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Utilisateur Form - Admin AutoRent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<nav th:replace="~{common/layout :: navbar}"></nav>

<div class="container-fluid p-0">
    <div class="d-flex" style="min-height: calc(100vh - 73px)">
        <div class="sidebar" style="width:240px;flex-shrink:0;">
            <div class="sidebar-header">
                <span class="role-badge">Admin</span>
                <p class="sidebar-title">Administration</p>
            </div>
            <nav class="sidebar-nav">
                <span class="nav-section">Tableau de bord</span>
                <a th:href="@{/admin/dashboard}" class="sidebar-link"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
                <span class="nav-section">Gestion</span>
                <a th:href="@{/admin/utilisateurs}" class="sidebar-link active"><i class="fas fa-users"></i> Utilisateurs</a>
                <a th:href="@{/admin/vehicules}" class="sidebar-link"><i class="fas fa-car"></i> Véhicules</a>
                <a th:href="@{/admin/categories}" class="sidebar-link"><i class="fas fa-tags"></i> Catégories</a>
                <a th:href="@{/admin/reservations}" class="sidebar-link"><i class="fas fa-calendar"></i> Réservations</a>
            </nav>
        </div>

        <div class="flex-grow-1 p-0">
            <div class="page-header">
                <div>
                    <h3>Nouvel Utilisateur</h3>
                    <ol class="breadcrumb breadcrumb-ar mb-0">
                        <li class="breadcrumb-item"><a th:href="@{/admin/utilisateurs}">Utilisateurs</a></li>
                        <li class="breadcrumb-item active">Nouveau</li>
                    </ol>
                </div>
            </div>

            <div class="px-4 pb-4">
                <div class="row justify-content-center">
                    <div class="col-md-7">
                        <div class="form-card">
                            <div class="form-card-header">
                                <i class="fas fa-user-plus me-2"></i>Créer un nouvel utilisateur
                            </div>
                            <div class="form-card-body">
                                <div th:if="${error}" class="alert-ar-danger mb-4">
                                    <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
                                </div>

                                <form th:action="@{/admin/utilisateur/nouveau}" method="post" th:object="${userDto}">
                                    <div class="row g-3">
                                        <div class="col-md-6">
                                            <label class="ar-label">Nom *</label>
                                            <input type="text" class="ar-input" th:field="*{nom}" required>
                                            <div style="color:var(--danger);font-size:0.8rem;margin-top:4px;"
                                                 th:errors="*{nom}"></div>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="ar-label">Prénom *</label>
                                            <input type="text" class="ar-input" th:field="*{prenom}" required>
                                        </div>
                                        <div class="col-12">
                                            <label class="ar-label">Email *</label>
                                            <input type="email" class="ar-input" th:field="*{email}" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="ar-label">Mot de passe *</label>
                                            <input type="password" class="ar-input" th:field="*{password}" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="ar-label">Confirmer MDP *</label>
                                            <input type="password" class="ar-input" th:field="*{confirmPassword}" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="ar-label">Téléphone</label>
                                            <input type="tel" class="ar-input" th:field="*{telephone}">
                                        </div>
                                        <div class="col-md-6">
                                            <label class="ar-label">Rôle *</label>
                                            <select class="ar-select" th:field="*{role}" required>
                                                <option value="CLIENT">Client</option>
                                                <option value="AGENT">Agent</option>
                                                <option value="ADMIN">Admin</option>
                                            </select>
                                        </div>
                                        <div class="col-12">
                                            <label class="ar-label">Adresse</label>
                                            <input type="text" class="ar-input" th:field="*{adresse}">
                                        </div>
                                    </div>
                                    <div class="d-flex gap-3 mt-4 pt-3" style="border-top:1.5px solid var(--border);">
                                        <a th:href="@{/admin/utilisateurs}" class="btn-outline-ar" style="display:flex;align-items:center;gap:8px;text-decoration:none;">
                                            <i class="fas fa-arrow-left"></i> Annuler
                                        </a>
                                        <button type="submit" class="btn-primary-ar flex-grow-1">
                                            <i class="fas fa-user-plus me-2"></i>Créer l'utilisateur
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{common/layout :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
