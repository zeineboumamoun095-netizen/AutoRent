<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inscription - AutoRent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="text-center mb-4">
                <a th:href="@{/}" class="text-decoration-none text-dark">
                    <i class="fas fa-car fa-3x text-warning"></i>
                    <h2 class="fw-bold mt-2">AutoRent</h2>
                </a>
            </div>

            <div class="card shadow">
                <div class="card-header bg-dark text-white text-center py-3">
                    <h4 class="mb-0"><i class="fas fa-user-plus me-2"></i>Créer un compte</h4>
                </div>
                <div class="card-body p-4">

                    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

                    <form th:action="@{/inscription}" method="post" th:object="${userDto}">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Nom</label>
                                <input type="text" class="form-control" th:field="*{nom}"
                                       th:classappend="${#fields.hasErrors('nom')} ? 'is-invalid'" required>
                                <div class="invalid-feedback" th:errors="*{nom}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Prénom</label>
                                <input type="text" class="form-control" th:field="*{prenom}"
                                       th:classappend="${#fields.hasErrors('prenom')} ? 'is-invalid'" required>
                                <div class="invalid-feedback" th:errors="*{prenom}"></div>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-bold">Email</label>
                                <input type="email" class="form-control" th:field="*{email}"
                                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" required>
                                <div class="invalid-feedback" th:errors="*{email}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Mot de passe</label>
                                <input type="password" class="form-control" th:field="*{password}"
                                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" required>
                                <div class="invalid-feedback" th:errors="*{password}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Confirmer le mot de passe</label>
                                <input type="password" class="form-control" th:field="*{confirmPassword}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Téléphone</label>
                                <input type="tel" class="form-control" th:field="*{telephone}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Adresse</label>
                                <input type="text" class="form-control" th:field="*{adresse}">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-warning w-100 fw-bold btn-lg mt-4">
                            <i class="fas fa-user-plus me-2"></i>Créer mon compte
                        </button>
                    </form>
                </div>
                <div class="card-footer text-center py-3">
                    <small class="text-muted">Déjà inscrit ?
                        <a th:href="@{/login}" class="fw-bold text-warning">Se connecter</a>
                    </small>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
